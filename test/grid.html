<!DOCTYPE html>
<html>
    <head>

<style>
:root {
    --cl_nav_border : rgb(79, 94, 79);

	--el_mainNavbackground_c0 : rgba(242, 242, 210, 0.3);
	--el_mainNavbackground_c1 : white;
	--el_mainNavbackground_wk_c0 : rgba(242, 242, 210, 0.3);
	--el_mainNavbackground_wk_c1 : white;
	--el_mainNavbackground : linear-gradient(to left, var(--el_mainNavbackground_c0), var(--el_mainNavbackground_c1) );
	--el_mainNavbackground_wk : -webkit-linear-gradient(to left, var(--el_mainNavbackground_wk_c0), var(--el_mainNavbackground_wk_c1));
	--el_mainNavborder_bottom : rgba(252,252,255,0.7);

    --cl_main_background : rgba(237, 237, 243, 0.5);
    --cl_main_border : rgb(237, 238, 221);
    --cl_main_border_top : #8833BB;

    --el_nav_height : 40px;
    --el_footer-height : 25px;
    --cl_footer_border : purple;
    --el_footerbackground_wk_c0 : rgba(252,252,255,0.5);
	--el_footerbackground_wk_c1 : #fffbe2;
	--el_footerbackground_c0 : rgba(252,252,255,0.5);
	--el_footerbackground_c1 : #fffbe2;
	--el_footerbackground_wk : -webkit-linear-gradient(to left, var(--el_footerbackground_wk_c0), var(--el_footerbackground_wk_c1) );
	--el_footerbackground : linear-gradient(to left, var(--el_footerbackground_c0), var(--el_footerbackground_c1) );


	--id_mainNavbackground_c0 : rgba(242, 242, 210, 0.3);
	--id_mainNavbackground_c1 : white;
	--id_mainNavbackground_wk_c0 : rgba(242, 242, 210, 0.3);
	--id_mainNavbackground_wk_c1 : white;

	--id_mainNavbackground : linear-gradient(to left, var(--id_mainNavbackground_c0), var(--id_mainNavbackground_c1) );
	--id_mainNavborder_bottom : rgba(252,252,255,0.7);
	--id_mainNavbackground_wk : -webkit-linear-gradient(to left, var(--id_mainNavbackground_wk_c0), var(--id_mainNavbackground_wk_c1));
	--id_mainNav_table_navbarcolor : white;
	--id_mainNav_table_navbarbackground_color : rgba(242,222,255,0.6);
    --fs_navbar_brand : 1.1rem;
    --ff_navbar : 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --header_padding : 0.5rem;
 
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
    min-height: 100dvh;
}

body {
    border: 1px solid black; -moz-box-sizing: border-box; box-sizing: border-box;
    position: fixed;
    width: 100dvw;
}



header {
    width: 100dvw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #f8f9fa;

    padding: 0.8rem var(--header_padding);

    background: var(--el_mainNavbackground_wk); 
    background: var(--el_mainNavbackground);
    border-bottom: var(--el_mainNavborder_bottom);
	border-left: solid 3px var(--cl_nav_border);
	border-top: solid 3px var(--cl_nav_border);
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: var(--el_nav_height);
    min-height: var(--el_nav_height);

    padding: 0px;

    font-family: var(--ff_navbar); 
    font-weight: 700;
    text-transform: uppercase;
}



.logo-area {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: bold;
    font-size: 0.8rem;
    max-width: 80px;
}
.shroom-area {
    display: none;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 1.2rem;
    max-width: 80px;
}

@media (max-width: 1100px) {
	.shroom-area {
        display: flex;
	}
}
.nav-links {
    display: flex;
    gap: calc(100dvw/8);
    width:calc(100dvw - 10%);
    list-style: none;
    margin: 0;
    padding: 0;
}
.nav-links li {
    width:calc(50dvw/8);
}
.nav-links a {
    text-decoration: none;
    color: #333;
}
.nav-link {
    font-size: 0.85em;
}



main {
    border: 1px var( --cl_main_border) solid;
    bottom: 0;
    min-height: calc(92dvh - var(--el_nav_height) - var(--el_footer-height) - var(--header_padding));
    max-height: calc(92dvh - var(--el_nav_height) - var(--el_footer-height) - var(--header_padding));
    overflow-y: auto;

	border-left: solid 3px var(--cl_nav_border);
	border-top: solid 1px var(--cl_main_border_top);
    background-color: var( --cl_main_background);
	padding : 0px;
}

footer {
    /* */
    width: 100%;
    height: var(--el_footer-height);
    bottom: 0;
    position: fixed;
    padding-left: 10px; padding-right: 10px; 
    background: var(--el_footerbackground_wk); 
    background: var(--el_footerbackground); 
    border: 1px var( --cl_footer_border) solid;
    text-align: center; 
    font-size: 0.85em;
    padding:4px;
}



</style>
<style>

:root {
    --cl_open_btn: #333;
    --cl_open_btn_bk: rgba(204, 252, 204, 0.699);
    --cl_close_btn: #333;
    --cl_close_btn_bk: white;
    --el_drawer_background_cl: white;
    --el_drawer_border_cl: navy;
    --el_drawer_box_shadow_cl: rgba(0,0,0,0.2)
}

/* DRAWER */
.drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 300px;
    background: var(--el_drawer_background_cl);
    border: 1px solid var(--el_drawer_border_cl);
    box-shadow: 0 -2px 10px var(--el_drawer_box_shadow_cl);
    /* Hide drawer off-screen */
    transform: translateY(100%);
    /* Smooth slide transition */
    transition: transform 0.4s ease-in-out;
    z-index: 1000;
}

/* Trigger animation when the URL hash matches #drawer */
#drawer:target {
    transform: translateY(0);
}

.drawer-content {
    padding: 20px;
}

.open-btn {
    font-weight: bolder;
    text-decoration: none;
    color: var(--cl_open_btn);
    background-color: var(--cl_open_btn_bk);
}

.close-btn {
    float: right;
    text-decoration: none;
    font-size: 24px;
    font-weight: bolder;
    color: var(--cl_close_btn);
    background-color: var(--cl_close_btn_bk);
}

</style>
<style>
    /* flexy box style */

:root {
	--cl_items_itembackground_wk_c0 : rgba(242, 242, 210, 0.3);
	--cl_items_itembackground_wk_c1 : white;
	--cl_items_itembackground_c0 : rgba(242, 242, 210, 0.3);
	--cl_items_itembackground_c1 : white;
	--cl_items_itembackground_wk : -webkit-linear-gradient(to right, var(--cl_items_itembackground_wk_c0), var(--cl_items_itembackground_wk_c1));
	--cl_items_itembackground : linear-gradient(to right, var(--cl_items_itembackground_c0), var(--cl_items_itembackground_c1) );
	--cl_items_itemcolor : #171e42;
}



.items {
	margin-left: 0px;
	margin-top: 0px;
    width: 100%;
    min-height:inherit;
}


@media screen and (min-width: 900px) {
.items {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  align-content: space-evenly;
  row-gap: 1dvh;
  /* grid-auto-rows: minmax(94px, calc((100dvh - var(--el_nav_height) - var(--el_footer-height) - var(--header_padding))/4.8)); */
}
.one {
  grid-column: 1 / 3;
  grid-row: 1 / 4;
}
.two {
  grid-column: 3/5;
  grid-row: 1 / 3;
}
.three {
  grid-column: 5/7;
  grid-row: 1 / 3;
}
.four {
  grid-column: 1/3;
  grid-row: 4;
}
.five {
  grid-column: 3/5;
  grid-row: 3/5;
}
.six {
  grid-column: 5/7;
  grid-row: 3;
}
.seven {
  grid-column: 5/7;
  grid-row: 4;
}

}

@media screen and (max-width: 900px) { 
    .items {
        display: grid;
        grid-column-gap: 1dvw;
        grid-row-gap: 10px;
        grid-template-columns: auto auto;
        background-color:  rgb(250, 250, 242);
        padding: 10px;
    }
}


@media screen and (max-width: 600px) { 
    .items {
        display: grid;
        grid-row-gap: 10px;
        grid-template-columns: auto;
        background-color: rgb(250, 250, 242);
        padding: 10px;
    }
}


.item {
	/* box-sizing: border-box; */
	background: var(--cl_items_itembackground_wk);
	background: var(--cl_items_itembackground);
	color: var(--cl_items_itemcolor);

}
.item {
    border: solid 1px green;
    /*border-right: none;*/
    min-height: calc((100dvh - var(--el_nav_height) - var(--el_footer-height) - var(--header_padding))/3.45);
}

</style>
